<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Conversions — Car Conversion Suite</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a0c10;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100vh; overflow-x: hidden; }
      ::selection { background: rgba(251,191,36,.3); }

      .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
      .glow1 { position: absolute; top: -20%; left: -10%; width: 600px; height: 600px; border-radius: 50%; background: rgba(245,158,11,.10); filter: blur(120px); }
      .glow2 { position: absolute; bottom: -30%; right: -10%; width: 500px; height: 500px; border-radius: 50%; background: rgba(14,165,233,.10); filter: blur(120px); }
      .grid { position: absolute; inset: 0; opacity: .025;
        background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
        background-size: 56px 56px; }

      .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 60px 20px 48px; }

      header { text-align: center; margin-bottom: 40px; }
      .kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: rgba(251,191,36,.85); margin-bottom: 16px; }
      .kicker::before, .kicker::after { content: ""; width: 32px; height: 1px; background: rgba(251,191,36,.4); }
      h1 { font-size: clamp(32px, 6vw, 48px); font-weight: 200; letter-spacing: -0.02em; }
      h1 b { font-weight: 600; background: linear-gradient(90deg, #fcd34d, #fbbf24, #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { margin-top: 12px; font-size: 14px; color: rgba(255,255,255,.45); max-width: 460px; margin-left: auto; margin-right: auto; }

      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 40px; }
      nav button { padding: 10px 20px; border-radius: 999px; font-size: 14px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: rgba(255,255,255,.6); cursor: pointer; transition: all .3s; font-family: inherit; }
      nav button:hover { color: #fff; border-color: rgba(255,255,255,.25); }
      nav button.active { background: linear-gradient(90deg, #fbbf24, #fb923c); color: #111; font-weight: 600; border-color: transparent; box-shadow: 0 4px 24px rgba(251,191,36,.35); }

      .card { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); backdrop-filter: blur(6px); box-shadow: 0 8px 40px rgba(0,0,0,.35); padding: 32px; transition: border-color .3s; }
      .card:hover { border-color: rgba(255,255,255,.2); }
      .card .blob { position: absolute; top: -64px; right: -64px; width: 192px; height: 192px; border-radius: 50%; filter: blur(48px); opacity: .2; }
      .head { display: flex; align-items: center; gap: 12px; }
      .icon { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; color: #fff; font-size: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
      .head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
      .head p { font-size: 12px; color: rgba(255,255,255,.4); }

      .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; margin-top: 24px; }
      @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .swap { justify-content: center; } }
      label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: rgba(255,255,255,.35); margin-bottom: 8px; }
      input[type=number], select { width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 12px 16px; color: #fff; font-family: inherit; outline: none; transition: box-shadow .2s, border-color .2s; font-variant-numeric: tabular-nums; }
      select { appearance: none; font-size: 14px; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,.4) 50%), linear-gradient(135deg, rgba(255,255,255,.4) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
      select option { background: #0d1117; color: #fff; }
      input[type=number] { font-size: 24px; font-weight: 300; }
      input[type=number]:focus, select:focus { border-color: rgba(251,191,36,.5); box-shadow: 0 0 0 2px rgba(251,191,36,.35); }
      .unit-select { margin-top: 12px; }

      .swap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 26px; }
      .swap button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); cursor: pointer; transition: all .35s; font-size: 14px; }
      .swap button:hover { background: rgba(255,255,255,.15); color: #fff; transform: rotate(180deg); }

      .result { width: 100%; border-radius: 12px; padding: 12px 16px; font-size: 24px; font-weight: 300; color: #fcd34d; font-variant-numeric: tabular-nums; min-height: 54px; display: flex; align-items: center; overflow-wrap: anywhere; background: linear-gradient(135deg, rgba(251,191,36,.1), transparent); border: 1px solid rgba(251,191,36,.2); }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
      .chip { font-size: 11px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
      .chip b { color: rgba(255,255,255,.9); font-weight: 500; }

      .tools-grid { display: grid; gap: 24px; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
      @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
      .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
      @media (max-width: 640px) { .mini-grid { grid-template-columns: 1fr; } }
      .mini { border-radius: 12px; padding: 12px 16px; background: rgba(244,63,94,.06); border: 1px solid rgba(244,63,94,.2); }
      .mini .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: rgba(255,255,255,.4); }
      .mini .val { font-size: 20px; font-weight: 300; color: #fda4af; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .mini.violet { background: rgba(139,92,246,.06); border-color: rgba(139,92,246,.2); }
      .mini.violet .val { color: #c4b5fd; }
      .formula { margin-top: 16px; font-size: 11px; color: rgba(255,255,255,.35); }

      footer { margin-top: 48px; text-align: center; font-size: 11px; color: rgba(255,255,255,.25); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="bg"><div class="glow1"></div><div class="glow2"></div><div class="grid"></div></div>

    <div class="wrap">
      <header>
        <div class="kicker">Precision Tools</div>
        <h1>Apex <b>Conversions</b></h1>
        <p class="sub">Speed, power, torque, fuel economy and gearing — every automotive unit, converted instantly.</p>
      </header>

      <nav id="tabs">
        <button data-tab="speed" class="active">Speed</button>
        <button data-tab="power">Power</button>
        <button data-tab="torque">Torque</button>
        <button data-tab="fuel">Fuel</button>
        <button data-tab="tyres">Tyres</button>
      </nav>

      <main id="panels"></main>

      <footer>Apex Conversions · Metric, imperial and motorsport standards · Values are exact conversions</footer>
    </div>

    <script>
      /* ===== Unit definitions ===== */
      const SPEED = { "km/h": 1, "mph": 1.609344, "m/s": 3.6, "knot": 1.852, "ft/s": 1.09728 };
      const POWER = { "kW": 1, "hp (metric / PS)": 0.73549875, "hp (imperial)": 0.74569987, "Watt": 0.001, "btu/min": 0.01758427 };
      const TORQUE = { "Nm": 1, "lb-ft": 1.35582, "kgf·m": 9.80665 };
      const PRESSURE = { "bar": 1, "psi": 0.0689476, "kPa": 0.01, "atm": 1.01325 };
      const FUEL = { "L/100km": 1, "km/L": 1, "mpg (US)": 1, "mpg (UK)": 1 };

      const toL100 = (v, u) => u === "L/100km" ? v : u === "km/L" ? 100 / v : u === "mpg (US)" ? 235.214583 / v : 282.480936 / v;
      const fromL100 = (v, u) => u === "L/100km" ? v : u === "km/L" ? 100 / v : u === "mpg (US)" ? 235.214583 / v : 282.480936 / v;

      const PANELS = {
        speed:    { title: "Speed", sub: "Velocity across imperial & metric systems", icon: "⚡", units: SPEED, preset: [120, "km/h", "mph"], grad: "linear-gradient(135deg,#fbbf24,#f97316)", blob: "#f59e0b" },
        power:    { title: "Power", sub: "Engine output — metric, imperial & mechanical", icon: "🔥", units: POWER, preset: [250, "kW", "hp (imperial)"], grad: "linear-gradient(135deg,#fb923c,#ef4444)", blob: "#f97316" },
        torque:   { title: "Torque", sub: "Rotational force at the crank or wheels", icon: "🔧", units: TORQUE, preset: [500, "Nm", "lb-ft"], grad: "linear-gradient(135deg,#34d399,#14b8a6)", blob: "#10b981" },
        fuel:     { title: "Fuel Economy", sub: "Consumption & efficiency — including inverse mpg units", icon: "⛽", units: FUEL, fuel: true, preset: [7.5, "L/100km", "mpg (US)"], grad: "linear-gradient(135deg,#38bdf8,#3b82f6)", blob: "#0ea5e9" },
        tyres:    { title: "Tyre Pressure", sub: "Cold inflation pressures, any standard", icon: "🛞", units: PRESSURE, preset: [2.4, "bar", "psi"], grad: "linear-gradient(135deg,#2dd4bf,#06b6d4)", blob: "#14b8a6" },
      };

      const fmt = (n) => {
        if (!isFinite(n)) return "—";
        const a = Math.abs(n);
        if (a === 0) return "0";
        if (a >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
        if (a >= 100) return n.toFixed(1);
        if (a >= 1) return n.toFixed(2);
        return n.toFixed(4);
      };

      function convert(v, from, to, cfg) {
        if (cfg.fuel) return fromL100(toL100(v, from), to);
        return (v * cfg.units[from]) / cfg.units[to];
      }

      /* ===== Build converter panels ===== */
      const panelsEl = document.getElementById("panels");

      function buildPanel(id) {
        const cfg = PANELS[id];
        const [pv, pf, pt] = cfg.preset;
        const options = (sel) => Object.keys(cfg.units).map((u) => "<option " + (u === sel ? "selected" : "") + ">" + u + "</option>").join("");
        const card = document.createElement("div");
        card.className = "card";
        card.id = "panel-" + id;
        card.innerHTML = `
          <div class="blob" style="background:${cfg.blob}"></div>
          <div class="head">
            <span class="icon" style="background:${cfg.grad}">${cfg.icon}</span>
            <div><h2>${cfg.title}</h2><p>${cfg.sub}</p></div>
          </div>
          <div class="row">
            <div>
              <label>From</label>
              <input type="number" class="in" value="${pv}" />
              <div class="unit-select"><select class="from">${options(pf)}</select></div>
            </div>
            <div class="swap"><button title="Swap units">⇄</button></div>
            <div>
              <label>To</label>
              <div class="result">—</div>
              <div class="unit-select"><select class="to">${options(pt)}</select></div>
            </div>
          </div>
          <div class="chips"></div>`;

        const inp = card.querySelector(".in"), fromSel = card.querySelector(".from"), toSel = card.querySelector(".to"), out = card.querySelector(".result"), chips = card.querySelector(".chips");
        const swapBtn = card.querySelector(".swap button");

        function update() {
          const v = parseFloat(inp.value);
          out.textContent = isFinite(v) ? fmt(convert(v, fromSel.value, toSel.value, cfg)) : "—";
          chips.innerHTML = Object.keys(cfg.units)
            .filter((u) => u !== fromSel.value && u !== toSel.value)
            .map((u) => '<span class="chip">' + u + ': <b>' + (isFinite(v) ? fmt(convert(v, fromSel.value, u, cfg)) : "—") + "</b></span>")
            .join("");
        }
        inp.addEventListener("input", update);
        fromSel.addEventListener("change", update);
        toSel.addEventListener("change", update);
        swapBtn.addEventListener("click", () => {
          const t = fromSel.value; fromSel.value = toSel.value; toSel.value = t; update();
        });
        update();
        return card;
      }

      /* ===== Render & tabs ===== */
      const built = {};
      function show(id) {
        if (!built[id]) {
          built[id] = buildPanel(id);
          panelsEl.appendChild(built[id]);
        }
        panelsEl.querySelectorAll(".card, .tools-grid").forEach((c) => c.classList.add("hidden"));
        built[id].classList.remove("hidden");
      }
      document.getElementById("tabs").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-tab]");
        if (!b) return;
        document.querySelectorAll("#tabs button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        show(b.dataset.tab);
      });
      show("speed");
    </script>
  </body>
</html>
